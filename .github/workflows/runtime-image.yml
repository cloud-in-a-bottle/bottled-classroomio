name: Build runtime image

on:
  workflow_dispatch:
  push:
    branches:
      - andrew/initial-package
    paths:
      - Dockerfile.components
      - Dockerfile.image
      - dashboard-proxy.conf
      - nginx.conf
      - sidecar.js
      - start.sh


permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  COMPONENT_IMAGE: ghcr.io/cloud-in-a-bottle/bottled-classroomio-components
  RUNTIME_IMAGE: ghcr.io/cloud-in-a-bottle/bottled-classroomio

jobs:
  components:
    strategy:
      fail-fast: false
      matrix:
        component: [api, dashboard, jobs]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.components
          target: ${{ matrix.component }}-runtime
          push: true
          tags: ${{ env.COMPONENT_IMAGE }}:${{ matrix.component }}-${{ github.sha }}
          cache-from: type=gha,scope=classroomio-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=classroomio-${{ matrix.component }}
          provenance: false

  runtime:
    needs: components
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.image
          build-args: COMPONENT_TAG=${{ github.sha }}
          push: true
          tags: |
            ${{ env.RUNTIME_IMAGE }}:${{ github.sha }}
            ${{ env.RUNTIME_IMAGE }}:edge
          cache-from: type=gha,scope=classroomio-runtime
          cache-to: type=gha,mode=max,scope=classroomio-runtime
          provenance: false
