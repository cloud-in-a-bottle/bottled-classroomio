name: Export runtime rootfs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Runtime image tag to export
        required: true
        type: string

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  RUNTIME_IMAGE: ghcr.io/cloud-in-a-bottle/bottled-classroomio

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export root filesystem
        env:
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          docker pull "${RUNTIME_IMAGE}:${IMAGE_TAG}"
          container_id="$(docker create "${RUNTIME_IMAGE}:${IMAGE_TAG}")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker export "$container_id" | gzip -1 > classroomio-rootfs.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: classroomio-rootfs-${{ inputs.tag }}
          path: classroomio-rootfs.tar.gz
          compression-level: 0
          retention-days: 7
