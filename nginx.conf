user www-data;
worker_processes auto;
pid /run/nginx/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    client_max_body_size 1g;
    client_body_timeout 3600s;
    client_body_temp_path /tmp/nginx/client_temp;
    proxy_temp_path /tmp/nginx/proxy_temp;

    # OpenHost replaces Host with its loopback upstream and preserves the real
    # public host in X-Forwarded-Host. Restoring it is mandatory for MinIO SigV4
    # verification and for ClassroomIO's absolute redirects.
    map $http_x_forwarded_host $public_host {
        default $http_x_forwarded_host;
        "" $http_host;
    }

    map $http_x_forwarded_proto $public_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    upstream classroomio_dashboard {
        server 127.0.0.1:3082;
        keepalive 16;
    }

    upstream classroomio_minio {
        server 127.0.0.1:9000;
        keepalive 16;
    }

    upstream classroomio_sidecar {
        server 127.0.0.1:8090;
        keepalive 4;
    }

    server {
        listen 8080;
        server_name _;

        location = /_healthz {
            access_log off;
            proxy_pass http://classroomio_sidecar/health;
            proxy_http_version 1.1;
        }

        # Until the first organization exists, only a request authenticated as
        # the Cloud in a Bottle owner may use ClassroomIO auth. This prevents an
        # internet visitor from claiming the fresh instance's administrator
        # account. The sidecar opens these routes automatically after bootstrap.
        location = /_bootstrap_auth {
            internal;
            proxy_pass http://classroomio_sidecar/bootstrap;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-OpenHost-Is-Owner $http_x_openhost_is_owner;
        }

        location = /signup {
            auth_request /_bootstrap_auth;
            include /etc/nginx/dashboard-proxy.conf;
        }

        location ^~ /signup/ {
            auth_request /_bootstrap_auth;
            include /etc/nginx/dashboard-proxy.conf;
        }

        location ^~ /api/auth/ {
            auth_request /_bootstrap_auth;
            include /etc/nginx/dashboard-proxy.conf;
        }

        location ^~ /proxy/api/auth/ {
            auth_request /_bootstrap_auth;
            include /etc/nginx/dashboard-proxy.conf;
        }

        # Preserve both the URI and public Host exactly. Both values are part of
        # an S3 presigned request's canonical signature. Do not log query strings:
        # they contain replayable SigV4 credentials.
        location ~ ^/(videos|documents|media)(/|$) {
            access_log off;
            proxy_pass http://classroomio_minio;
            proxy_http_version 1.1;
            proxy_set_header Host $public_host;
            proxy_set_header X-Forwarded-Host $public_host;
            proxy_set_header X-Forwarded-Proto $public_proto;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            include /etc/nginx/dashboard-proxy.conf;
        }
    }
}
